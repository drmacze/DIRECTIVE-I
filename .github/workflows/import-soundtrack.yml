name: Import DIRECTIVE I soundtrack

on:
  push:
    paths:
      - '.github/workflows/import-soundtrack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-soundtrack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download soundtrack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl -L --fail --retry 2 --connect-timeout 20 \
            'https://uc1d5268bb3565c406fa16b95666.dl.dropboxusercontent.com/cd/0/get/DH25LeCZmElOBLUKU-j4FtZSHijDDQWWfs1Uz6-khTwbInxz4CJ3ocni4Zi0jRckj0NhkN5F5q9lChV-LkbtenPXs5Ut2UeEq9r7CiJsHtta-pF2UQbe4VhKqouCdHrH5K3sxuVQ-VE9YUH4DExH1GbAG5-BLSkFk-EwJUo5J1oENg/file?c_luid=9f5de864' \
            -o assets/audio/directive-i-s1.mp3
          test "$(stat -c%s assets/audio/directive-i-s1.mp3)" -eq 5579520

      - name: Commit soundtrack into GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/directive-i-s1.mp3
          if git diff --cached --quiet; then
            echo 'Soundtrack already present.'
            exit 0
          fi
          git commit -m 'Host Season I soundtrack on GitHub Pages'
          git push origin HEAD:main
