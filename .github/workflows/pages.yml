name: Deploy DIRECTIVE I to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cinematic media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          # Rebuild the repository-backed trailer first.
          cat assets/transmission-v2-b64/part-* | tr -d '\n\r ' | base64 --decode > assets/directive-i-transmission-001.mp4
          test -s assets/directive-i-transmission-001.mp4

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

          HERO_SOURCE="assets/directive-i-hero-source.mp4"
          HERO_OUTPUT="assets/directive-i-hero-1080.mp4"
          HERO_URL="https://image-link.edgeone.app/1788957619264-ml7zjo.mp4"

          # Fetch the full-quality cinematic source during deployment instead of
          # shipping the tiny repository preview as the fullscreen hero.
          if curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1" \
            "$HERO_URL" \
            -o "$HERO_SOURCE" \
            && ffprobe -v error "$HERO_SOURCE" >/dev/null 2>&1; then
            echo "Using full cinematic source for hero."
          else
            echo "Remote cinematic source unavailable; falling back to trailer media."
            cp assets/directive-i-transmission-001.mp4 "$HERO_SOURCE"
          fi

          # Produce one same-origin 1080p H.264 asset. Lanczos scaling plus a
          # restrained sharpen pass avoids the browser doing a soft fullscreen upscale.
          ffmpeg -hide_banner -loglevel error -y \
            -i "$HERO_SOURCE" \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos,crop=1920:1080,unsharp=5:5:0.35:5:5:0.0" \
            -an \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -profile:v high \
            -level 4.1 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -g 60 \
            -keyint_min 30 \
            "$HERO_OUTPUT"

          # Posters give iOS a sharp frame immediately and remain visible if its
          # webview temporarily delays autoplay.
          ffmpeg -hide_banner -loglevel error -y \
            -ss 0.35 -i "$HERO_OUTPUT" -frames:v 1 -q:v 2 assets/directive-i-hero-poster.jpg
          ffmpeg -hide_banner -loglevel error -y \
            -ss 0.35 -i assets/directive-i-transmission-001.mp4 -frames:v 1 -q:v 2 assets/directive-i-trailer-poster.jpg

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,codec_name,pix_fmt \
            -of default=noprint_wrappers=1 "$HERO_OUTPUT"
          test -s "$HERO_OUTPUT"
          test -s assets/directive-i-hero-poster.jpg

          rm -f "$HERO_SOURCE"
          rm -rf assets/transmission-v2-b64 assets/transmission-001-b64 assets/trailer-b64
          touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
