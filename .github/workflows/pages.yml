name: Deploy DIRECTIVE I to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild trailer assets
        shell: bash
        run: |
          set -e
          mkdir -p assets
          cat assets/trailer-b64/video.part-* | tr -d '\n\r ' | base64 --decode > assets/directive-i-teaser-01.mp4
          tr -d '\n\r ' < assets/trailer-b64/poster.b64 | base64 --decode > assets/trailer-poster.jpg
          touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
