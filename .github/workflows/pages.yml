name: Deploy DIRECTIVE I to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cinematic media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat assets/transmission-v2-b64/part-* | tr -d '\n\r ' | base64 --decode > assets/directive-i-transmission-001.mp4
          test -s assets/directive-i-transmission-001.mp4
          rm -rf assets/transmission-v2-b64 assets/transmission-001-b64 assets/trailer-b64
          touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
