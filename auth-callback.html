<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050707" />
  <meta name="robots" content="noindex,nofollow" />
  <title>DIRECTIVE I — Microsoft Authentication</title>
  <style>
    :root{--bg:#050707;--panel:#0b0f0d;--line:rgba(255,255,255,.13);--text:#f3f5f3;--muted:#8f9992;--green:#70e224}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));overflow-x:hidden;background:radial-gradient(circle at 50% 20%,rgba(112,226,36,.08),transparent 34%),#050707}
    .card{width:min(620px,100%);border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,20,17,.94),rgba(7,10,9,.96));padding:clamp(26px,7vw,52px);position:relative;overflow:hidden}
    .card:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:46px 46px;opacity:.22;pointer-events:none}
    .brand,.status,.copy,.actions{position:relative;z-index:1}.brand{font-weight:900;font-size:25px;letter-spacing:-.04em}.brand b{color:var(--green);margin-left:.18em}.status{margin-top:42px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.copy h1{margin:12px 0 0;font-size:clamp(40px,10vw,72px);line-height:.9;letter-spacing:-.06em}.copy p{margin:20px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.actions{margin-top:34px}.actions a{display:flex;align-items:center;justify-content:center;min-height:54px;border:1px solid var(--green);background:var(--green);color:#071004;text-decoration:none;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.spinner{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 16px rgba(112,226,36,.75);margin-right:9px;animation:pulse 1.15s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span>DIRECTIVE</span><b>I</b></div>
    <div class="status" data-status><span class="spinner"></span>Validating Microsoft response</div>
    <div class="copy">
      <h1 data-title>Securing Xbox identity.</h1>
      <p data-copy>DIRECTIVE I is exchanging the Microsoft authorization response through the secure backend. Your Microsoft password never passes through this page.</p>
    </div>
    <div class="actions"><a href="welcome.html" data-return hidden>Return to secure access</a></div>
  </main>
  <script>
    (()=>{
      const BACKEND='https://ydaeukhqwishlrjyfktk.supabase.co/functions/v1/minecraft-auth';
      const p=new URLSearchParams(location.search);
      const title=document.querySelector('[data-title]');
      const copy=document.querySelector('[data-copy]');
      const status=document.querySelector('[data-status]');
      const returnLink=document.querySelector('[data-return]');

      const fail=(heading,message)=>{
        status.textContent='Authentication was not completed';
        title.textContent=heading;
        copy.textContent=message;
        returnLink.hidden=false;
      };

      if(p.has('error')){
        fail('Microsoft sign-in cancelled.',p.get('error_description')||'The Microsoft authorization request did not complete. Return to DIRECTIVE I and try again.');
        return;
      }

      const code=p.get('code')||'';
      const returnedState=p.get('state')||'';
      let expectedState='';
      try{expectedState=sessionStorage.getItem('directive_microsoft_oauth_state')||'';}catch(_){}

      if(!code){
        status.textContent='Authentication endpoint active';
        title.textContent='Microsoft callback ready.';
        copy.textContent='This callback URL is active. Start the sign-in flow from the DIRECTIVE I welcome page.';
        returnLink.hidden=false;
        return;
      }

      if(!expectedState||!returnedState||expectedState!==returnedState){
        fail('Security check failed.','The Microsoft sign-in state did not match this browser session. Return to DIRECTIVE I and start the login again.');
        return;
      }

      try{sessionStorage.removeItem('directive_microsoft_oauth_state');}catch(_){}

      fetch(BACKEND,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code})
      })
      .then(async response=>{
        const data=await response.json().catch(()=>({}));
        if(!response.ok||!data?.ok||!data?.account){
          throw new Error(data?.error||`Secure backend returned HTTP ${response.status}.`);
        }
        try{sessionStorage.setItem('directive_minecraft_account',JSON.stringify(data.account));}catch(_){}
        status.textContent='Xbox identity verified';
        title.textContent=data.account.gamertag?`Welcome, ${data.account.gamertag}.`:'Minecraft identity verified.';
        copy.textContent='Gamertag and Xbox identity were verified successfully. Returning to DIRECTIVE I secure onboarding…';
        setTimeout(()=>location.replace('welcome.html?auth=success'),750);
      })
      .catch(error=>{
        fail('Account verification failed.',error?.message||'The secure Minecraft/Xbox authentication backend could not verify this account.');
      });
    })();
  </script>
</body>
</html>
