<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050707" />
  <meta name="robots" content="noindex,nofollow" />
  <title>DIRECTIVE I — Microsoft Authentication</title>
  <style>
    :root{--bg:#050707;--line:rgba(255,255,255,.13);--text:#f4f6f4;--muted:#8f9992;--green:#70e224;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100svh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 18px max(26px,env(safe-area-inset-bottom));overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(112,226,36,.075),transparent 31%),#050707}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(135deg,#000,transparent 82%)}
    .auth-shell{width:min(680px,100%);position:relative;z-index:2;perspective:1200px}
    .auth-card{position:relative;width:100%;min-height:610px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(14,20,16,.96),rgba(7,10,9,.985));padding:clamp(30px,7vw,58px);overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.28);transition:opacity .8s ease,transform 1s var(--ease),filter .8s ease}
    .auth-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(112,226,36,.035),transparent 42%);pointer-events:none}
    .auth-card:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:54px 54px;opacity:.22;pointer-events:none}
    .auth-card.is-leaving{opacity:0;transform:translate3d(-5%,0,-28px) scale(.985);filter:blur(11px)}
    .layer{position:relative;z-index:2}.brand{display:inline-flex;align-items:baseline;font-weight:950;font-size:clamp(25px,5.7vw,34px);letter-spacing:-.065em;line-height:1}.brand span{color:#f3f5f3}.brand b{color:var(--green);margin-left:.16em}
    .micro{margin-top:50px;display:flex;align-items:center;gap:10px;color:var(--green);font-size:9px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;opacity:0;transform:translateY(14px);animation:fadeUp 1s .12s var(--ease) forwards}.micro i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 18px rgba(112,226,36,.65);animation:pulse 1.2s ease-in-out infinite}
    .title{margin:16px 0 0;font-size:clamp(52px,11vw,88px);line-height:.87;letter-spacing:-.075em;font-weight:950;max-width:560px}.reveal-line{display:block;overflow:hidden}.reveal-line>span{display:block;transform:translateY(118%);opacity:0;animation:textIn 1.12s var(--ease) forwards}.reveal-line:nth-child(2)>span{animation-delay:.12s}
    .copy{margin:28px 0 0;max-width:560px;color:var(--muted);font-size:clamp(15px,2.3vw,18px);line-height:1.75;opacity:0;transform:translateY(14px);animation:fadeUp 1s .3s var(--ease) forwards}
    .lifecycle{margin-top:46px;padding-top:18px;border-top:1px solid var(--line)}.lifecycle-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;color:#a8b0ab;font-size:8px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.lifecycle-head strong{color:var(--green);font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.lifecycle-track{height:4px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}.lifecycle-bar{height:100%;width:0;background:linear-gradient(90deg,var(--green),#a6ff6a);box-shadow:0 0 16px rgba(112,226,36,.34);transition:width .38s ease}.lifecycle-scan{position:absolute;inset:0 auto 0 -24%;width:24%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:scan 1.4s linear infinite}
    .actions{margin-top:28px}.actions[hidden]{display:none}.actions a{display:flex;align-items:center;justify-content:center;min-height:54px;border:1px solid var(--green);background:var(--green);color:#071004;text-decoration:none;font-size:10px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}
    .portal{position:fixed;inset:0;z-index:9999;pointer-events:none}.portal i{position:absolute;display:block;background:#000;transition:transform 1.08s cubic-bezier(.7,0,.2,1)}.portal-top{top:0;left:0;right:0;height:50%;transform:translateY(-101%)}.portal-bottom{bottom:0;left:0;right:0;height:50%;transform:translateY(101%)}.portal-left{left:0;top:0;bottom:0;width:50%;transform:translateX(-101%)}.portal-right{right:0;top:0;bottom:0;width:50%;transform:translateX(101%)}.portal.is-closing i{transform:translate(0,0)}
    @keyframes textIn{to{transform:none;opacity:1}}@keyframes fadeUp{to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.38;transform:scale(.72)}}@keyframes scan{to{transform:translateX(520%)}}
    @media(max-width:620px){.auth-card{min-height:570px;padding:28px 24px}.micro{margin-top:38px}.copy{font-size:14px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" data-auth-card>
      <div class="layer">
        <div class="brand"><span>DIRECTIVE</span><b>I</b></div>
        <div class="micro" data-status><i></i><span>Validating Microsoft response</span></div>
        <h1 class="title" data-title><span class="reveal-line"><span>Securing Xbox</span></span><span class="reveal-line"><span>identity.</span></span></h1>
        <p class="copy" data-copy>DIRECTIVE I is validating the Microsoft authorization response, establishing Xbox trust, and resolving the connected player identity through the secure backend.</p>
        <div class="lifecycle">
          <div class="lifecycle-head"><span data-lifecycle-label>Verification lifecycle</span><strong data-lifecycle-percent>0%</strong></div>
          <div class="lifecycle-track"><div class="lifecycle-bar" data-lifecycle-bar></div><div class="lifecycle-scan" data-lifecycle-scan></div></div>
        </div>
        <div class="actions" data-actions hidden><a href="welcome.html">Return to secure access</a></div>
      </div>
    </section>
  </main>
  <div class="portal" data-portal aria-hidden="true"><i class="portal-top"></i><i class="portal-right"></i><i class="portal-bottom"></i><i class="portal-left"></i></div>
  <script>
  (() => {
    const BACKEND = 'https://ydaeukhqwishlrjyfktk.supabase.co/functions/v1/minecraft-auth';
    const p = new URLSearchParams(location.search);
    const card = document.querySelector('[data-auth-card]');
    const status = document.querySelector('[data-status] span');
    const title = document.querySelector('[data-title]');
    const copy = document.querySelector('[data-copy]');
    const actions = document.querySelector('[data-actions]');
    const bar = document.querySelector('[data-lifecycle-bar]');
    const percent = document.querySelector('[data-lifecycle-percent]');
    const label = document.querySelector('[data-lifecycle-label]');
    const scan = document.querySelector('[data-lifecycle-scan]');
    const portal = document.querySelector('[data-portal]');
    let progress = 0;
    let target = 12;
    let raf = 0;

    const setProgress = (value, text) => {
      progress = Math.max(progress, Math.min(100, value));
      bar.style.width = `${progress}%`;
      percent.textContent = `${Math.round(progress)}%`;
      if (text) label.textContent = text;
    };
    const drive = () => {
      if (progress < target) setProgress(Math.min(target, progress + Math.max(.06, (target - progress) * .021)));
      raf = requestAnimationFrame(drive);
    };
    drive();
    setTimeout(() => { target = 34; setProgress(progress, 'Microsoft authorization'); }, 420);
    setTimeout(() => { target = 58; setProgress(progress, 'Xbox user authentication'); }, 1150);
    setTimeout(() => { target = 76; setProgress(progress, 'XSTS trust validation'); }, 1950);
    setTimeout(() => { target = 90; setProgress(progress, 'Resolving player profile'); }, 2750);

    const fail = (heading, message) => {
      cancelAnimationFrame(raf);
      scan.style.display = 'none';
      setProgress(100, 'Verification interrupted');
      status.textContent = 'Authentication was not completed';
      title.innerHTML = `<span class="reveal-line"><span style="animation:none;transform:none;opacity:1">${heading}</span></span>`;
      copy.textContent = message;
      copy.style.opacity = '1';
      copy.style.transform = 'none';
      actions.hidden = false;
    };

    if (p.has('error')) {
      fail('Sign-in cancelled.', p.get('error_description') || 'The Microsoft authorization request did not complete.');
      return;
    }

    const code = p.get('code') || '';
    const returnedState = p.get('state') || '';
    let expectedState = '';
    try { expectedState = sessionStorage.getItem('directive_microsoft_oauth_state') || ''; } catch (_) {}

    if (!code) {
      fail('Callback ready.', 'Start authentication from the DIRECTIVE I welcome page.');
      return;
    }
    if (!expectedState || !returnedState || expectedState !== returnedState) {
      fail('Security check failed.', 'The Microsoft sign-in state did not match this browser session. Start login again.');
      return;
    }
    try { sessionStorage.removeItem('directive_microsoft_oauth_state'); } catch (_) {}

    const saveProfile = account => {
      const value = {
        gamertag: account?.gamertag || '',
        xuid: String(account?.xuid || ''),
        displayName: account?.displayName || account?.gamertag || '',
        gamerpic: account?.gamerpic || '',
        gamerscore: String(account?.gamerscore || ''),
        provider: account?.provider || 'Microsoft/Xbox',
        authenticated: true,
        updatedAt: Date.now()
      };
      try {
        localStorage.setItem('directive_minecraft_profile', JSON.stringify(value));
        localStorage.setItem('directive_local_session', String(Date.now()));
        localStorage.setItem('directive_onboarding_complete', '1');
        sessionStorage.setItem('directive_minecraft_account', JSON.stringify(value));
        sessionStorage.setItem('directive_minecraft_gamertag', value.gamertag);
        sessionStorage.setItem('directive_minecraft_xuid', value.xuid);
        sessionStorage.setItem('directive_pending_profile', '1');
        sessionStorage.setItem('directive_home_entry', '1');
        sessionStorage.setItem('directive_music_enabled', '0');
        sessionStorage.setItem('directive_music_should_play', '0');
        sessionStorage.setItem('directive_music_track', '0');
        sessionStorage.setItem('directive_music_time', '0');
        sessionStorage.setItem('directive_music_saved_at', String(Date.now()));
      } catch (_) {}
    };

    fetch(BACKEND, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    }).then(async response => {
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data?.ok || !data?.account) {
        throw new Error(data?.error || `Secure backend returned HTTP ${response.status}.`);
      }

      saveProfile(data.account);
      cancelAnimationFrame(raf);
      setProgress(100, 'Identity verification complete');
      scan.style.display = 'none';
      status.textContent = 'Xbox identity verified';

      setTimeout(() => {
        card.classList.add('is-leaving');
        setTimeout(() => {
          portal.classList.add('is-closing');
          setTimeout(() => location.replace('index.html?auth=verified'), 1110);
        }, 520);
      }, 420);
    }).catch(error => {
      fail('Verification failed.', error?.message || 'The secure Minecraft/Xbox authentication backend could not verify this account.');
    });
  })();
  </script>
</body>
</html>
